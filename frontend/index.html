<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catch Hub</title>
  </head>

  <body class="bg-gray-100 p-6 text-gray-900">
    <main class="mx-auto max-w-md rounded-lg bg-white p-6 shadow-md">
      <header class="mb-6">
        <h1 class="text-3xl font-bold">Catch Hub</h1>
        <p id="socket-status" class="mt-1 text-sm text-gray-500">
          Verbinden...
        </p>
      </header>

      <!-- FORMULIER VOOR DEELNAME -->
      <section id="join-section">
        <form id="join-form" class="flex flex-col gap-4">
          <div>
            <label
              for="player-name"
              class="block text-sm font-medium text-gray-700"
              >Naam</label
            >
            <input
              type="text"
              id="player-name"
              name="playerName"
              required
              placeholder="Bijv. Vince"
              class="mt-1 w-full rounded border border-gray-300 p-2 focus:border-blue-500 focus:outline-none"
            />
          </div>

          <div>
            <label
              for="session-code"
              class="block text-sm font-medium text-gray-700"
              >Sessie code</label
            >
            <input
              type="text"
              id="session-code"
              name="sessionCode"
              required
              value="CATCH123"
              placeholder="Bijv. CATCH123"
              class="mt-1 w-full rounded border border-gray-300 p-2 uppercase focus:border-blue-500 focus:outline-none"
            />
          </div>

          <fieldset class="mt-2">
            <legend class="block text-sm font-medium text-gray-700">
              Kies je rol
            </legend>
            <div class="mt-2 flex gap-3">
              <button
                type="submit"
                data-role="runner"
                class="flex-1 rounded border border-gray-300 bg-white px-4 py-2 font-semibold text-gray-800 hover:bg-gray-50"
              >
                Join as Runner
              </button>
              <button
                type="submit"
                data-role="hunter"
                class="flex-1 rounded border border-gray-300 bg-white px-4 py-2 font-semibold text-gray-800 hover:bg-gray-50"
              >
                Join as Hunter
              </button>
            </div>
          </fieldset>
        </form>
      </section>

      <!-- GAME UI (ZICHTBAAR NA JOINEN) -->
      <section id="game-ui" class="mt-6 hidden border-t border-gray-200 pt-6">
        <h2 id="role-display" class="text-xl font-semibold"></h2>

        <button
          id="share-location"
          class="mt-4 w-full rounded border border-gray-300 bg-white px-4 py-2 font-semibold text-gray-800 hover:bg-gray-50"
        >
          Share my location
        </button>
        <p id="location" class="mt-4 text-sm text-gray-600">
          Nog geen locatie gedeeld.
        </p>

        <div class="mt-6 border-t border-gray-200 pt-4">
          <h3 class="text-sm font-bold uppercase tracking-wide text-gray-700">
            Spelers in sessie (<span id="session-code-display">CATCH123</span>)
          </h3>
          <ul id="players-list" class="mt-3 flex flex-col gap-2"></ul>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
