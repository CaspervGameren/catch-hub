services:
  - type: web
    name: catch-hub-sockets
    runtime: node
    plan: free
    branch: deployment
    buildCommand: corepack enable && corepack prepare pnpm@12.5.1 --activate && pnpm --dir socket-server install --frozen-lockfile --prod=false && pnpm --dir socket-server check
    startCommand: pnpm --dir socket-server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
