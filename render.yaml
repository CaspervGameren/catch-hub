services:
  - type: web
    name: catch-hub-sockets
    runtime: node
    plan: free
    branch: deployment
    buildCommand: npx --yes pnpm@12.5.1 --dir socket-server install --frozen-lockfile --prod=false && npx --yes pnpm@12.5.1 --dir socket-server check
    startCommand: npx --yes pnpm@12.5.1 --dir socket-server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
